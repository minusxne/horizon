[package]
name = "horizon-launcher"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Prepares and starts Skyline builds, offline"

[workspace]

[[bin]]
name = "skyline-launcher"
path = "src/main.rs"

[dependencies]
gpui = "0.2.2"
# Only the local server's control API on this computer (servers.rs); the patched ureq refuses
# every address that is not loopback.
ureq = { version = "2", features = ["json"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Checks the client jar and the version file found in other launchers' folders (sources.rs).
sha1 = "0.10"
# Fingerprints of prepared resources (backend::legacy_fingerprint).
sha2 = "0.10"
flate2 = "1"
toml = "1.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
dirs = "5"
# The system's preferred languages, for the window's language (i18n.rs).
sys-locale = "0.3"
clap = { version = "4", features = ["derive"] }
horizon-theme = { path = "../crates/horizon-theme" }
horizon-core = { path = "../crates/horizon-core" }
horizon-prepare = { path = "../crates/horizon-prepare" }
horizon-bench = { path = "../crates/horizon-bench" }
# The mod API level a game program carries (backend::mod_api_level).
horizon-mods = { path = "../crates/horizon-mods" }
# level.dat and servers.dat (the worlds and server lists of instances)
horizon-world = { path = "../crates/horizon-world" }
# Deleting a world moves it to the system's trash
trash = "5"
# Backup names carry the local time, as vanilla's do
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Players' heads on the Servers page, from the default skins in the player's own game files (already
# in the lockfile through gpui).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Painting the window's title bar dark or light (titlebar::apply_appearance): crates already in
# the lockfile through gpui and wgpu.
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSAppearance", "NSView", "NSWindow"] }
raw-window-handle = "0.6"

[target.'cfg(windows)'.build-dependencies]
# The icon resource in the .exe (build.rs).
winresource = "0.1"

# Offline: requests reach loopback addresses only.
[patch.crates-io]
ureq = { path = "../third_party/ureq" }

[profile.release]
strip = true
